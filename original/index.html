/* Homepage hours: show two rows and advance one row every five seconds. */
const hoursRows=[['자료열람실','09:00 ~ 20:00'],['일반열람실','06:00 ~ 23:00'],['법학도서관','09:00 ~ 17:00'],['The H Reading Lounge','09:00 ~ 22:00'],['대학로도서관','09:00 ~ 17:00']];
const HOURS_ROW_HEIGHT=20;
let hoursTimer=null,hoursOffset=2,hoursMoving=false;
function initHoursTicker(){
 if(hoursTimer){clearInterval(hoursTimer);hoursTimer=null}
 const track=$('#hoursTrack');
 if(!track)return;
 hoursOffset=2;hoursMoving=false;
 track.style.transition='none';
 track.style.transform='translateY(-'+(hoursOffset*HOURS_ROW_HEIGHT)+'px)';
 track.addEventListener('transitionend',()=>{
  if(hoursOffset===hoursRows.length+2)hoursOffset=2;
  else if(hoursOffset===1)hoursOffset=hoursRows.length+1;
  track.style.transition='none';
  track.style.transform='translateY(-'+(hoursOffset*HOURS_ROW_HEIGHT)+'px)';
  hoursMoving=false;
 });
 function step(delta){
  if(hoursMoving)return;
  hoursMoving=true;
  hoursOffset+=delta;
  track.style.transition='transform .4s ease';
  track.style.transform='translateY(-'+(hoursOffset*HOURS_ROW_HEIGHT)+'px)';
 }
 document.querySelectorAll('[data-hour-step]').forEach(b=>b.onclick=()=>step(Number(b.dataset.hourStep)));
 hoursTimer=setInterval(()=>{if(document.contains(track))step(1);else{clearInterval(hoursTimer);hoursTimer=null}},5000);
}

function initCalendarScroller(){
 const track=$('#calendarTrack');if(!track)return;
 let index=0;
 document.querySelectorAll('[data-calendar-step]').forEach(b=>b.onclick=()=>{
  index=Math.max(0,Math.min(2,index+Number(b.dataset.calendarStep)));
  track.style.transition='transform .4s ease';
  track.style.transform='translateY(-'+(index*HOURS_ROW_HEIGHT)+'px)';
 });
}

function bookHtml(b,i){return `<article class="book"><button class="cover" data-book="${i}" aria-label="${esc(b[0])} 상세보기">HONGIK<span>UNIVERSITY<br>LIBRARY</span></button><div><span class="tag">도서</span> <span class="tag ${b[5]?'available':'unavailable'}">${b[5]?'이용가능':'이용불가'}</span><h3><button data-book="${i}" style="padding:0;text-align:left">${esc(b[0])}</button></h3><p>${esc(b[1])}<br>서울 : ${esc(b[2])}, ${b[3]}</p><button class="holdings" aria-expanded="false" data-hold="${i}">소장정보 ⌄</button><div class="holding hidden" id="holding-${i}">중앙도서관 · ${i%2?'정보통신센터(Q동) 5층':'본관(H동) 4층'}<br>청구기호　658.8 ${100+i}<br>자료상태　${b[5]?'대출가능':'대출중 (반납예정: 2026.11.25)'}</div></div></article>`}
function card(title,items,wide=false){return `<section class="resultcard ${wide?'wide':''}"><div class="cardhead"><h2>${title}</h2><span>${items.length} 건</span><button data-all="${title}">전체보기</button></div>${items.length?items.slice(page*5,page*5+5).map(b=>bookHtml(b,books.indexOf(b))).join(''):'<div class="empty">검색 결과가 없습니다.</div>'}${items.length>5?`<div class="pager"><button data-page="0" ${page===0?'disabled':''}>‹ 이전 페이지</button><button data-page="1" ${page===1?'disabled':''}>다음 페이지 ›</button></div>`:''}</section>`}
function matching(){let arr=books.filter(b=>(b.join(' ').toLowerCase().includes(q.toLowerCase())||q==='디자인'));return arr}
function results(){HongikLiveSearch.render(q,'results',main)}
function catalog(){HongikLiveSearch.render(q,'catalog',main)}
function updateCatalog(){let arr=matching().filter(b=>(!$('#available').checked||b[5])&&(!$('#lang').value||b[4]===$('#lang').value)&&(!$('#year').value||+b[3]>=+$('#year').value));if($('#sort').value!=='relevance')arr.sort((a,b)=>$('#sort').value==='new'?b[3]-a[3]:a[3]-b[3]);$('#count').textContent=`‘${q}’ 검색 결과 ${arr.length}건`;$('#catalogbooks').innerHTML=arr.length?arr.map(b=>bookHtml(b,books.indexOf(b))).join(''):'<p class="empty">조건에 맞는 자료가 없습니다. 검색어나 필터를 변경해 주세요.</p>'}
function show(title,html){$('#dialogContent').innerHTML=`<h2>${esc(title)}</h2><div class="detail">${html}</div>`;$('#dialog').showModal()}$('.close').onclick=()=>$('#dialog').close();$('#dialog').onclick=e=>{if(e.target===$('#dialog'))$('#dialog').close()};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.info){let n=b.dataset.info;show(n,`<p>${esc(n)} 화면은 이번 재현본의 검색 실험 범위에 포함되지 않습니다.</p><p>실제 로그인·신청·결제는 실행되지 않습니다.</p>`)}if(b.dataset.book!==undefined){let v=books[+b.dataset.book];show(v[0],`<p>저자　${esc(v[1])}<br>발행사항　${esc(v[2])}, ${v[3]}<br>언어　${v[4]}<br>자료유형　도서</p><h3>소장정보</h3><p>중앙도서관 본관(H동) 4층<br>청구기호　658.8 ${100+Number(b.dataset.book)}<br>상태　${v[5]?'대출가능':'대출중'}</p><small>실험용 가상 서지·소장정보입니다.</small>`)}if(b.dataset.hold!==undefined){let v=$('#holding-'+b.dataset.hold);v.classList.toggle('hidden');b.setAttribute('aria-expanded',!v.classList.contains('hidden'))}if(b.dataset.all!==undefined)search(q,'catalog');if(b.dataset.page!==undefined){page=+b.dataset.page;results()}if(b.dataset.notice!==undefined){document.querySelectorAll('[data-notice]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.notices li').forEach((li,i)=>li.classList.toggle('hidden',b.dataset.notice==='2'&&i<2||b.dataset.notice==='1'&&i>=3))}});
$('#advanced').onclick=()=>{show('고급검색',`<form id="advancedForm"><p><label>검색 항목 <select id="field"><option>전체</option><option>제목</option><option>저자</option></select></label></p><p><label>검색어 <input id="advancedQuery" required style="padding:10px;width:75%"></label></p><button class="login" type="submit">검색</button></form>`);$('#advancedForm').onsubmit=e=>{e.preventDefault();let value=$('#advancedQuery').value;$('#dialog').close();search(value,'catalog')}};
function renderRoute(){HongikLiveSearch.cancel();if(hoursTimer){clearInterval(hoursTimer);hoursTimer=null}const p=new URLSearchParams(location.search);q=p.get('q')||'';$('#query').value=q;if(q){const v=p.get('view')||'results';if(v==='catalog')catalog();else if(v.startsWith('section-'))HongikLiveSearch.render(q,v,main);else results()}else home();document.title=q?`${q} 검색 결과 | 기존 UI 재현`:'홍익대학교 중앙도서관 | 기존 UI 재현'}window.onpopstate=renderRoute;renderRoute();
</script></body></html>
