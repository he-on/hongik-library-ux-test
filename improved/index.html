<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F3F5FB">
<title>홍익대학교 중앙도서관 메인 개선안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F3F5FB;--sf:#FFFFFF;--ink:#141A2E;--mu:#586178;--ln:#DCE1EE;--br:#1F3FD1;--bs:#E7ECFF;--on:#FFFFFF;
 --hero1:#1226D0;--hero2:#0B1A9E;--ok:#1B7448;--okb:#E3F4EA;--wn:#9A5400;--wnb:#FFEFD6;--cl:#586178;--clb:#ECEFF6;--cov:#DCE4F7;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}


html{scroll-behavior:smooth;scroll-padding-top:84px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.w{max-width:1180px;margin:0 auto;padding:0 24px}
h1,h2,h3{margin:0;line-height:1.3}
/* header */
.top{position:sticky;top:0;z-index:50;background:var(--sf);border-bottom:1px solid var(--ln)}
.nav{display:flex;align-items:center;gap:28px;height:64px}
.logo{font-weight:900;font-size:18px;color:var(--br);white-space:nowrap}.logo span{color:var(--ink);font-weight:500}
.nav nav{display:flex;gap:26px;margin:0 auto;font-weight:500;font-size:15px}
.nav nav a:hover{color:var(--br)}
.nb{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.nb.p{background:var(--br);border-color:var(--br);color:var(--on)}
/* hero */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;position:relative;overflow:hidden}
.hero::after{content:"LIBRARY";position:absolute;right:-10px;bottom:-26px;font-size:120px;font-weight:900;letter-spacing:.12em;color:rgba(255,255,255,.07);pointer-events:none}
.hin{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;padding:44px 24px 40px;align-items:start;position:relative;z-index:1}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;opacity:.8}
.hero h1{font-size:34px;font-weight:900;margin:8px 0 6px}
.hero p{margin:0;opacity:.85}
.stabs{display:flex;gap:2px;margin-top:22px}
.stabs button{border:0;background:rgba(255,255,255,.16);color:#fff;padding:9px 18px;font-weight:700;cursor:pointer;border-radius:8px 8px 0 0}
.stabs button[aria-selected="true"]{background:#fff;color:#1226D0}
.sf{display:flex;background:#fff;border-radius:0 10px 10px 10px;overflow:hidden;color:#141A2E}
.sf select{border:0;background:#EEF1FB;padding:0 12px;font-weight:700;color:#1226D0}
.sf input{flex:1;min-width:0;border:0;padding:15px 16px;font-size:17px;background:transparent;color:#141A2E}
.sf input:focus-visible{outline:none}
.sf button{border:0;background:#0B1A9E;color:#fff;font-weight:700;padding:0 26px;cursor:pointer}
.ql{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13.5px}
.ql a{opacity:.9;text-decoration:underline;text-underline-offset:3px}
.ql b{font-weight:700;opacity:1}
/* hours */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px}
.hours{color:var(--ink)}
.hh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.hh h2{font-size:18px}
.hh span{font-size:13px;color:var(--mu)}
.hsub{font-size:12.5px;color:var(--mu);margin:0 0 8px}
.hr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}
.hr:first-of-type{border-top:0}
.hn{font-weight:700;font-size:14.5px}.hn.big{color:var(--br)}
.ht{font-size:17px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}.ht.off{color:var(--mu);font-weight:500;font-size:15px}
#more[hidden]{display:none}#more .hr:first-of-type{border-top:1px solid var(--ln)}
.tg{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:4px;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--br)}
.tg::after{content:"";width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-3px;transition:transform .2s}
.tg[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:0 9px;border-radius:999px;margin-left:8px;vertical-align:1px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.o{background:var(--okb);color:var(--ok)}.chip.s{background:var(--wnb);color:var(--wn)}.chip.c{background:var(--clb);color:var(--cl)}.chip.c::before{border-radius:1px}
.track{grid-column:1/-1;position:relative;height:6px;border-radius:3px;background:var(--ln);margin-top:3px}
.seg{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--br);opacity:.85}
.now{position:absolute;top:-4px;bottom:-4px;width:2px;background:#E0245E}
.hfoot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:var(--mu)}
.hfoot a{color:var(--br);font-weight:700}
/* guide */
.guide{background:var(--sf);border-bottom:1px solid var(--ln)}
.gin{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:18px 24px;align-items:center}
.gin small{font-size:11px;font-weight:700;color:var(--br);letter-spacing:.08em}
.gin strong{display:block;font-size:17px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0;padding:0;list-style:none}
.steps a{display:flex;gap:10px;align-items:center;border:1px solid var(--ln);border-radius:10px;padding:10px 14px;background:var(--bg)}
.steps a:hover,.steps a.cur{border-color:var(--br);background:var(--bs)}
.steps i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--br);color:var(--on);font:700 12px/24px "Noto Sans KR",sans-serif;text-align:center}
.steps b{display:block;font-size:14px;line-height:1.3}.steps span{font-size:12px;color:var(--mu)}
/* sections */
section.sec{padding:44px 0 8px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.sh small{font-size:12px;font-weight:700;color:var(--br);letter-spacing:.08em}
.sh h2{font-size:24px}.sh p{margin:2px 0 0;color:var(--mu);font-size:14px}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.gc{display:flex;flex-direction:column;padding:0;overflow:hidden}
.gt{padding:18px 18px 12px}
.gt i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--br);color:var(--on);font:700 14px "Noto Sans KR",sans-serif;margin-bottom:8px}
.gt h3{font-size:18px}.gt p{margin:2px 0 0;font-size:13px;color:var(--mu)}
.gc ul{list-style:none;margin:0;padding:0 8px;flex:1}
.gc li a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font-weight:500;font-size:14.5px}
.gc li a:hover{background:var(--bs);color:var(--br)}
.gc li a small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.gc li a::after{content:"";flex:none;width:7px;height:7px;border:solid var(--mu);border-width:2px 2px 0 0;transform:rotate(45deg)}
.gm{margin:8px 18px 16px;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:8px;font-weight:700;color:var(--br);cursor:pointer;font-size:13.5px}
.gm:hover{background:var(--bs)}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;font-size:14px}
.who b{margin-right:4px}.who a{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:4px 14px;font-weight:500}.who a:hover{border-color:var(--br);color:var(--br)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:3px 14px;font-size:13px;font-weight:700;color:var(--mu);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--br);border-color:var(--br);color:var(--on)}
.nl{list-style:none;margin:0;padding:0}
.nl li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--ln)}
.nl li:first-child{border-top:0}
.nl em{font-style:normal;font-size:12px;font-weight:700;color:var(--br);background:var(--bs);border-radius:4px;padding:0 8px}
.nl span.d{margin-left:auto;font-size:12.5px;color:var(--mu);white-space:nowrap}
.ev{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--ln)}
.ev:first-of-type{border-top:0}
.ev time{flex:none;width:52px;text-align:center;border:1px solid var(--ln);border-radius:8px;line-height:1.2;padding:4px 0}
.ev time b{display:block;font-size:20px}.ev time small{font-size:10px;color:var(--mu);letter-spacing:.08em}
.ev span{display:block;font-size:12.5px;color:var(--mu)}
.bk{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.bk div{font-size:13.5px;font-weight:500}.bk small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.cv{aspect-ratio:3/4;border-radius:3px 8px 8px 3px;background:var(--cov);box-shadow:inset 7px 0 0 rgba(0,0,0,.08);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--br);font-weight:700;margin-bottom:8px}
.dp{margin:40px 0 24px;border:1px dashed var(--ln);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--mu);background:var(--sf)}
footer{border-top:1px solid var(--ln);padding:20px 0 40px;font-size:12.5px;color:var(--mu);background:var(--sf)}
/* drawer, toast */
.ov{position:fixed;inset:0;background:rgba(10,15,40,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--sf);z-index:61;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dr.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--ln)}
.dh h2{font-size:18px}
.dq{margin:12px 20px 4px;border:1px solid var(--ln);border-radius:10px;padding:10px 14px;background:var(--bg)}
.db{overflow:auto;padding:4px 20px 24px;flex:1}
.db details{border-bottom:1px solid var(--ln)}
.db summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between}
.db summary::after{content:"+";color:var(--mu)}.db details[open] summary::after{content:"\2212"}
.db summary small{font-weight:400;color:var(--mu);margin-left:8px;font-size:12.5px}
.db ul{list-style:none;margin:0 0 12px;padding:0}
.db li a{display:block;padding:7px 10px;border-radius:8px;font-size:14.5px}.db li a:hover{background:var(--bs);color:var(--br)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#141A2E;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){.nav nav{display:none}.nav{justify-content:space-between}.hin{grid-template-columns:1fr;padding:28px 16px}.gin{grid-template-columns:1fr}.gr{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.bk{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.w{padding:0 16px}.hero h1{font-size:26px}.gin{padding:14px 16px}.steps{grid-template-columns:1fr}.gr{grid-template-columns:1fr}.bk{grid-template-columns:repeat(2,1fr)}.sf button{padding:0 16px}.sf select{display:none}.nb.hide{display:none}.sh h2{font-size:21px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.dr,.ov,.toast{transition:none}}

/* Group 5 / Group 19 home redesign */
.ov{z-index:200}.dr{z-index:201}.toast{z-index:250}
:root{--bg:#fff;--ink:#121931;--br:#0034dc;--bs:#edf2ff;--ln:#dce3f2}body{background:white}.w{max-width:1604px;padding:0 32px}
.top{z-index:100;border:0}.header-line{height:89px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:14px}
.logo{color:#0033d7;font-size:24px;font-weight:900;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:-.05em}
.logo span{color:inherit}.logo .library-name{font-weight:500}
.logo .logo-icon{width:24px;height:17px;display:block;flex:none;color:#0033d7}
.header-tools{display:flex;align-items:center;gap:18px}
.header-tool{height:42px;width:36px;border:0;background:none;display:grid;place-items:center;color:#475877;cursor:pointer;padding:0}
.header-tool svg{width:25px;height:25px}.header-lang{height:48px;width:48px;border:0;border-radius:50%;background:#0033d7;color:#fff;font-weight:800;cursor:pointer}
.hours-anchor{position:relative}
.hours-toggle{border:1.5px solid #cbd5e9;border-radius:40px;height:46px;padding:0 16px;display:flex;align-items:center;gap:9px;background:#fff;white-space:nowrap;cursor:pointer}
.hours-toggle .hint{color:#51617c;font-size:14px;font-weight:700}.hours-toggle .clock{font-size:18px;font-weight:900;color:#11172d}
.hours-toggle svg{height:18px;width:18px;color:#475877;transition:transform .2s}.hours-toggle[aria-expanded=true] svg{transform:rotate(180deg)}
.hours-popup{position:fixed;right:32px;top:98px;width:min(490px,calc(100vw - 20px));background:#0733d6;border-radius:17px;padding:24px 17px 18px;box-shadow:0 16px 25px #101a3f55,0 2px 40px #0002;z-index:155;color:#fff}
.hours-popup[hidden]{display:none!important}
.hours-popup-title{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 10px 17px}.hours-popup-title h2{font-size:24px;color:#fff;font-weight:900}.hours-popup-title time{font-size:15px;font-weight:600}
.hours-popup-body{background:white;border-radius:13px;padding:10px 24px 17px;color:#222}
.hour-item{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:63px;border-bottom:2px solid #dce3f2}.hour-item:last-child{border:0}
.hour-item strong{color:#0034dc;font-size:20px;font-weight:800;white-space:nowrap}.hour-item time{color:#666;font-size:22px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hours-popup-body p{color:#666;font-size:14px;line-height:1.5;margin:10px 1px 15px}.hours-popup-body a{display:block;text-align:right;color:#0034dc;font-weight:700;font-size:14px}
.primo-strip{height:138px;display:flex;align-items:center;justify-content:center;gap:24px;max-width:1128px;margin:0 auto}
.primo-wrap{width:520px;flex:none}.primo-label{display:block;color:#0034dc;font-size:17px;font-weight:900;margin-bottom:5px;line-height:1.35}
.primo-form{display:flex;overflow:hidden;border:2.5px solid #0c1327;border-radius:13px;height:56px;background:#fff}
.primo-form select{width:130px;flex:none;background:white;border:0;padding:0 14px;font-size:16px;font-weight:800;cursor:pointer}
.primo-form input{min-width:0;flex:1;border:0;background:white;padding:0 10px;font-size:16px;outline:0}
.primo-form input::placeholder{color:#777}.primo-form button{flex:none;width:60px;border:0;background:#0033d7;color:white;display:grid;place-items:center;cursor:pointer}.primo-form button svg{width:29px;height:29px}
.advanced-link{font-size:16px;font-weight:800;margin-top:23px;white-space:nowrap}
.menu-strip{height:76px;border-top:1px solid #dce3f2;border-bottom:1px solid #dce3f2}
.menu-strip-inner{max-width:1604px;margin:auto;height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) 69px}
.menu-strip a{display:grid;place-items:center;font-size:20px;font-weight:800;white-space:nowrap}.menu-strip a:hover{color:#0034dc;background:#f7f9ff}
.menu-strip button{border:0;background:#0033d7;color:white;display:grid;place-items:center;cursor:pointer}.menu-strip button svg{height:30px;width:30px}
.quick-row{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));max-width:1540px;margin:0 auto;min-height:202px;padding-top:43px;border-bottom:1px solid #dce3f2}
.quick-row a{display:flex;align-items:center;flex-direction:column;gap:14px;padding:10px 5px 21px;color:#536080;font-weight:800;font-size:15px;text-align:center;line-height:1.5;border-bottom:4px solid transparent}
.quick-row svg{width:40px;height:40px;flex:none}.quick-row a:first-child,.quick-row a:hover{color:#111931;border-bottom-color:#0034dc}
.sample-banner{margin:32px 32px 0}.sample-banner-inner{height:335px;max-width:1540px;margin:auto;background:#fff4bc;border-radius:23px;overflow:hidden;position:relative;padding:53px 48px;color:#31200e}
.sample-banner-inner:after{content:"";position:absolute;width:345px;height:460px;right:25px;top:-45px;border:8px solid #ffffffaf;border-radius:24px;transform:rotate(-12deg);box-shadow:inset 0 0 0 40px #ffffff19;pointer-events:none}
.banner-tag{font:700 22px Georgia,serif}.sample-banner h1{font:900 56px/1.2 Georgia,"Noto Serif KR",serif;letter-spacing:-.02em;margin:10px 0 5px}
.banner-description{font:700 19px Georgia,"Noto Serif KR",serif;margin:0 0 28px;max-width:880px}
.banner-info{display:flex;align-items:end;gap:35px;font-size:15px;font-weight:600}.banner-info span{border-top:2px solid #4b3921;padding-top:6px;white-space:nowrap}.banner-info strong{font:700 27px Georgia,serif;white-space:nowrap}
.banner-ctl{position:absolute;z-index:2;right:24px;bottom:20px;display:flex;align-items:center;gap:10px}.banner-ctl button{border:0;cursor:pointer}
.banner-circle{height:39px;width:39px;border-radius:50%;background:#aba68c;color:#fff;font-size:22px}
.banner-dot{height:10px;width:10px;border-radius:40px;background:#c7c0a4;padding:0}.banner-dot.active{background:#0034dc;width:38px}
.home-feature{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:30px;margin-top:37px}.home-feature .card{padding:33px 37px;min-height:300px;border-radius:22px}
.home-feature h2{font-size:26px;font-weight:900;padding-bottom:22px;border-bottom:1px solid #d6deed;margin-bottom:17px}
.home-feature .tabs{gap:8px}.home-feature .tabs button{background:#f3f6ff;border-radius:9px;padding:8px 18px}.home-feature .tabs button[aria-pressed=true]{background:#0033d7;color:#fff}
.home-feature .nl a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home-feature .nl .d{font-size:11px}
.home-feature .promotion{border:0;min-height:300px;background:#ffdf27;border-radius:22px;padding:28px;color:#10279b;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;cursor:pointer}
.promotion strong{font-size:32px;font-weight:900;line-height:1.4}.promotion small{font-size:14px;margin-top:8px}
.infographic p{font-size:16px;font-weight:800}.infograph-line{display:grid;grid-template-columns:1fr 1fr 20px;align-items:center;gap:10px;font-size:13px;margin:10px 0;color:#50617c}
.infograph-line i{display:block;background:#7ba5e5;height:11px;border-radius:2px}

  x:["단행본 찾기","학술논문 찾기","학위논문","연속간행물","멀티미디어 자료"]},

  x:["이용자 등록","연체·반납 안내","The H Reading Lounge","사물함"]},

  x:["학술DB 이용 안내","학위논문 제출","오픈액세스"]},
 {id:"info",n:4,t:"안내·소식",d:"이용시간, 공지, 위치",
  m:[["이용시간 전체 보기","열람실별 시간","#hours"],["공지사항","일반, 학술","#news"],["도서관 일정","행사, 교육","#news"],["오시는 길·연락처","위치 및 교통편 안내","https://honors.hongik.ac.kr/facility-device/facility-usage/location/"]],

 $$("#db details").forEach(d=>d.open=g?d.dataset.g===g:d.dataset.g==="find");$("#close").focus()}

 if(e.target.closest(".db a[href^='#']:not([data-na])"))close()});
$("#dq").oninput=e=>{const q=e.target.value.trim();$$("#db details").forEach(d=>{let hit=0;d.querySelectorAll("li").forEach(li=>{const m=!q||li.textContent.includes(q);li.hidden=!m;hit+=m});d.hidden=!hit;if(q)d.open=true})};

$("#sf").onsubmit=e=>{
 e.preventDefault();
 const input=$("#sf input");
 const query=input.value.trim();
 if(!query){input.focus();toast("검색어를 입력해 주세요.");return}
 const field=$("#sf select").value;
 if(field==="주제어"){toast("주제어별 검색은 이번 시연에서 제공되지 않습니다. 제목 또는 저자로 검색해 주세요.");return}
 const selected="통합검색";

 if(field==="제목"||field==="저자")params.set("field",field);
 location.assign("./search.html?"+params.toString());
};
