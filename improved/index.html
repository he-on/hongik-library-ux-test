<html lang="ko">

<style>
:root{
  --bg:#F3F5FB;--surface:#FFFFFF;--ink:#141A2E;--muted:#586178;--line:#DCE1EE;
  --brand:#1F3FD1;--brand-soft:#E7ECFF;--on-brand:#FFFFFF;
  --ok:#1B7448;--ok-bg:#E3F4EA;--warn:#9A5400;--warn-bg:#FFEFD6;--cover:#DCE4F7;--cover-ink:#3A4E9A;--hl:#FFF0B3;
  --r-lg:14px;--r-md:10px;--r-sm:6px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1222;--surface:#151C30;--ink:#E8EBF6;--muted:#9AA4BF;--line:#29324F;
  --brand:#8EA2FF;--brand-soft:#1D2750;--on-brand:#0D1222;
  --ok:#6FD9A3;--ok-bg:#14301F;--warn:#F2B766;--warn-bg:#3A2A12;--cover:#202B52;--cover-ink:#9FB0FF;--hl:#4B3F14;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222;--surface:#151C30;--ink:#E8EBF6;--muted:#9AA4BF;--line:#29324F;
  --brand:#8EA2FF;--brand-soft:#1D2750;--on-brand:#0D1222;
  --ok:#6FD9A3;--ok-bg:#14301F;--warn:#F2B766;--warn-bg:#3A2A12;--cover:#202B52;--cover-ink:#9FB0FF;--hl:#4B3F14;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;letter-spacing:-.01em}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-weight:700;font-size:18px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);line-height:1.2}
header nav{display:flex;gap:24px;font-size:14px;color:var(--muted)}
.search{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin:24px 0;padding:20px 24px 16px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:8px 16px 10px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--brand);border-color:var(--brand);font-weight:700}
.field{display:flex;border:2px solid var(--brand);border-radius:var(--r-md);overflow:hidden;background:var(--bg)}
.field select{border:0;background:var(--brand-soft);padding:0 14px;font-weight:500;color:var(--brand)}
.field input{flex:1;border:0;background:transparent;padding:14px 16px;font-size:17px;min-width:0}
.field input:focus-visible{outline:none}
.field:focus-within{box-shadow:0 0 0 3px var(--brand-soft)}
.btn{border:1px solid transparent;border-radius:var(--r-sm);padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;text-align:center;display:block;width:100%}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-line{background:var(--surface);color:var(--brand);border-color:var(--line)}
.btn-line:hover{border-color:var(--brand)}
.field .btn{width:auto;border-radius:0;padding:0 28px;font-size:15px}
.hint{margin:10px 0 0;font-size:13px;color:var(--muted)}
.layout{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start;padding-bottom:48px}
aside{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;position:sticky;top:16px}
aside h2{font-size:16px;margin:0 0 4px}
fieldset{border:0;border-top:1px solid var(--line);margin:16px 0 0;padding:14px 0 0}
fieldset:first-of-type{border-top:0;margin-top:8px}
legend{font-size:13px;font-weight:700;padding:0;color:var(--muted)}
.opt{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--brand);margin:0}
.opt span:last-child{margin-left:auto;font-size:12px;color:var(--muted)}
.opt.off{opacity:.45;cursor:default}
.reset{margin-top:18px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar h2{margin:0;font-size:17px}
.bar h2 span{font-weight:400;font-size:13px;color:var(--muted);margin-left:8px}
.bar select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 12px;font-size:14px}
.card{display:grid;grid-template-columns:96px 1fr 148px;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:14px}
.cover{height:134px;border-radius:4px 8px 8px 4px;background:var(--cover);color:var(--cover-ink);display:flex;align-items:flex-end;padding:10px 8px;font-size:11px;font-weight:500;line-height:1.3;box-shadow:inset 6px 0 0 rgba(0,0,0,.08)}
.card h3{margin:0;font-size:19px;line-height:1.35;color:var(--brand)}
.by{margin:2px 0 12px;font-size:14px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.col{padding:12px 14px}
.col+.col{border-left:1px solid var(--line);background:var(--bg)}
.col h4{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
dt{color:var(--muted)}dd{margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.ok::before,.badge.warn::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.warn::before{border-radius:1px}
.actions{display:flex;flex-direction:column;gap:8px;justify-content:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);padding:40px 24px;text-align:center}
.empty p{margin:0 0 14px;color:var(--muted)}
.empty .btn{display:inline-block;width:auto}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}aside{position:static}
  .card{grid-template-columns:80px 1fr}.card .actions{grid-column:1/-1;flex-direction:row}
  .cols{grid-template-columns:1fr}.col+.col{border-left:0;border-top:1px solid var(--line)}
  header nav{display:none}.wrap{padding:0 16px}
}
.cover.alt{background:var(--brand-soft);color:var(--brand)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.tag{display:inline-block;margin-left:10px;font-size:12px;font-weight:500;padding:0 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.tag.top{background:var(--brand-soft);border-color:transparent;color:var(--brand);font-weight:700}
</style>

<style>

dialog#book-detail{width:min(550px,calc(100vw - 30px));max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:24px;background:var(--surface);color:var(--ink);box-shadow:0 15px 80px #0004}

@media(max-width:560px){

 .field select{width:78px;padding:0 3px;font-size:12px}

 #book-detail .book-info{grid-template-columns:90px 1fr}

 eres("아몬드","손원평","전자책","창비","2017",EL,A,"온라인 열람 (학내외 접속)"),
 eres("아몬드","손원평","오디오북","예시 오디오 플랫폼","2019",EL,B,"동시 이용 한도 도달, 대기 후 이용"),
 eres("아몬드 영양 성분 데이터베이스","식품영양 데이터","데이터베이스","식품정보센터","2024",EL,A,"온라인 접속"),
 eres("다이아몬드 산업 동향 연간 리포트","광물자원 연구기관","보고서 (PDF)","광물자원연구소","2023",EL,A,"PDF 내려받기"),
 eres("문학 서평 아카이브 2017–2022","서평 아카이브 편집부","서평 데이터베이스","예시 서평 DB","2022",EL,A,"온라인 접속","아몬드 서평 수록"),
];
const GROUPS=[["lib","소장 도서관",[CEN,MJ,EL]],["st","대출 상태",[A,B]],["type","자료 유형",["단행본","학술논문","전자자료"]]];
const LABEL={[A]:"대출 가능",[EL]:"전자도서관 (온라인)"};
const safeHtml=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TAG={100:"제목 일치",80:"제목이 검색어로 시작",60:"제목에 포함",40:"제목 일부 포함",30:"저자명 일부 포함",20:"본문에서 언급"};
const sel={lib:new Set(),st:new Set(),type:new Set(["단행본"])};
const $=s=>document.querySelector(s);
const Q=()=>$("#q").value.trim();
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const cell=(d,k)=>(d.l.concat(d.r).find(x=>x[0]===k)||[0,""])[1];
const norm=t=>t.replace(/[『』「」()\[\]:,]/g," ").replace(/\s+/g," ").trim();
function score(d,q){if(!q)return 0;const t=norm(d.t);if(d.t===q)return 100;if(t.startsWith(q))return 80;if(t.split(" ").some(w=>w.startsWith(q)))return 60;if(t.includes(q))return 40;if(d.by.includes(q))return 30;return 20}
function found(d,q){if(!q)return true;const f=$("#field").value;const h={제목:d.t+" "+(d.kw||"")+" "+d.by,저자:d.by,출판사:cell(d,"출판사"),청구기호:cell(d,"청구기호")}[f];return h.toLowerCase().includes(q.toLowerCase())}
const base=()=>{const q=Q();return DATA.map((d,i)=>({...d,rowId:i,s:score(d,q)})).filter(d=>found(d,q))};
function filtered(skip){return base().filter(d=>GROUPS.every(([k])=>k===skip||!sel[k].size||sel[k].has(d[k])))}
function renderFilters(){
  $("#filters").innerHTML=GROUPS.map(([k,name,opts])=>`<fieldset><legend>${name}</legend>`+opts.map(o=>{
    const n=filtered(k).filter(d=>d[k]===o).length;
    return `<label class="opt${n||sel[k].has(o)?"":" off"}"><input type="checkbox" data-k="${k}" value="${o}" ${sel[k].has(o)?"checked":""}><span>${LABEL[o]||o}</span><span>${n}</span></label>`}).join("")+`</fieldset>`).join("");
}
function card(d){
  const q=Q(),hl=s=>q?safeHtml(s).replace(new RegExp(esc(safeHtml(q)),"gi"),m=>`<mark>${m}</mark>`):safeHtml(s);
  const bk=d.type==="단행본",on=d.lib===EL,ok=d.st===A;
  const badge=ok?(bk?"대출 가능":"열람 가능"):(bk?"대출 중":"이용 중");
  const sub=ok?(on?"바로 열람":"서가 위치 보기"):(bk?"예약 안내":"이용 대기 안내");
  const rows=a=>a.map(([k,v])=>`<dt>${safeHtml(k)}</dt><dd>${safeHtml(v)}</dd>`).join("");
  const cov=bk?safeHtml(d.t.split(" (")[0])+"<br>"+safeHtml(d.by):safeHtml(d.type)+"<br>"+safeHtml(d.l[0][1]);
  return `<article class="card">
   <div class="cover${bk?"":" alt"}" aria-hidden="true">${cov}</div>
   <div>
    <h3>${hl(d.t)}</h3><p class="by">${hl(d.by)}${q?`<span class="tag${d.s===100?" top":""}">${TAG[d.s]}</span>`:""}</p>
    <div class="cols">
     <div class="col"><h4>${d.L}</h4><dl>${rows(d.l)}</dl></div>
     <div class="col"><h4>${d.R}</h4>
      <div class="badges"><span class="badge">${d.lib}</span><span class="badge ${ok?"ok":"warn"}">${badge}</span></div>
      <dl>${rows(d.r)}</dl></div>
    </div>
   </div>
   <div class="actions"><button class="btn btn-primary" data-action="detail" data-row="${d.rowId}">상세정보</button><button class="btn btn-line" data-action="map" data-row="${d.rowId}">${sub}</button></div>
  </article>`}
function render(){
  renderFilters();
  const rank=d=>d.s+(d.st===A?5:0)+(d.lib===CEN?1:0);
  const r=filtered().sort($("#sort").value==="avail"?(a,b)=>(b.st===A)-(a.st===A)||b.s-a.s:(a,b)=>rank(b)-rank(a));
  $("#count").innerHTML=`검색 결과 ${r.length}건<span>시연용 도서 정보</span>`;
  $("#list").innerHTML=r.length?r.map(card).join(""):`<div class="empty"><p>선택한 조건에 맞는 자료가 없어요. 필터를 줄이면 더 많은 결과를 볼 수 있어요.</p><button class="btn btn-primary" id="reset2">필터 초기화</button></div>`;
  const r2=$("#reset2");if(r2)r2.onclick=reset;
}
function reset(){Object.values(sel).forEach(s=>s.clear());render()}
$("#filters").addEventListener("change",e=>{const i=e.target;if(!i.dataset.k)return;i.checked?sel[i.dataset.k].add(i.value):sel[i.dataset.k].delete(i.value);render()});
$("#reset").onclick=reset;$("#sort").onchange=render;$("#go").onclick=render;$("#field").onchange=render;
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")render()});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t))});
render();
</script>
